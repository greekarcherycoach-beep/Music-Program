<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dj Ape1</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mltheme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="fonts.css">
<script src="jsmediatags.min.js"></script>
<style>
:root{--bg:#f5f4f0;--card:#fff;--tx:#1c1c1a;--mu:#74736d;--bd:#e4e2dc;--ac:#c2410c;--ac2:#fde7d9;--web:#1d4ed8;--web2:#dde8ff}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--tx:#efeee9;--mu:#9b9a93;--bd:#33322f;--ac:#fb923c;--ac2:#3b2413;--web:#85a9ff;--web2:#1b2848}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
/* welcome */
#welcome{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;width:100%;text-align:center;background:var(--card);border:2px dashed var(--bd);border-radius:20px;padding:44px 28px;transition:.15s}
.box.drag{border-color:var(--ac);background:var(--ac2)}
.box .ic{font-size:56px}.box h1{margin:8px 0 6px;font-size:28px}.box p{color:var(--mu);margin:0 0 22px}
.big{background:var(--ac);color:#fff;border:0;padding:14px 28px;border-radius:12px;font-weight:700;font-size:17px;cursor:pointer}
.big:hover{filter:brightness(1.08)}
.opt{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:20px;color:var(--mu);font-size:14px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--ac)}
#prog{margin-top:18px;color:var(--mu)}.pb{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;width:0;background:var(--ac);transition:.2s}
/* app */
#app{display:grid;grid-template-columns:270px 1fr;height:100%}
aside{background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
aside h2{margin:0;padding:18px 18px 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
#glist{overflow:auto;padding:6px 10px 14px;flex:1}
.gi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;position:relative}
.gi:hover{background:var(--bg)}.gi.on{background:var(--ac2);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.gi .n{margin-left:auto;color:var(--mu);font-size:13px}
.gi .bar{position:absolute;left:10px;bottom:2px;height:2px;border-radius:2px;opacity:.5}
.side-foot{padding:12px 14px;border-top:1px solid var(--bd);display:grid;gap:8px}
.sm{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;cursor:pointer}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
.top input[type=search]{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.top select{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{background:var(--bg);border:0;padding:9px 12px;cursor:pointer}.seg .on{background:var(--ac);color:#fff}
.info{padding:10px 20px;color:var(--mu);font-size:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#webst{color:var(--web)}
#content{overflow:auto;padding:4px 20px 40px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;transition:.12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0002}
.cv{aspect-ratio:1;background:var(--bd) center/cover;display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--mu)}
.cb{padding:10px 12px 12px}.cb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cb span{color:var(--mu);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.tag.w{outline:2px solid var(--web);outline-offset:1px}.tag.no{background:none!important;border:1px dashed var(--mu);color:var(--mu);font-weight:400}
.lrow{display:grid;grid-template-columns:48px 1.4fr 1fr 1fr 1.2fr 60px;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.lrow:hover{background:var(--card)}.lrow .cv{width:44px;height:44px;aspect-ratio:auto;border-radius:6px;font-size:20px}
.lrow .tags{margin:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mu{color:var(--mu)}
/* modal */
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mc{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.mh{display:flex;gap:16px;align-items:flex-start}.mh .cv{width:130px;height:130px;aspect-ratio:auto;border-radius:12px;flex:none}
.mh h2{margin:0 0 4px}.x{margin-left:auto;background:none;border:0;font-size:26px;cursor:pointer;color:var(--mu)}
.gbig{margin:18px 0;padding:14px;border-radius:12px;background:var(--ac2)}.gbig small{display:block;color:var(--mu);margin-bottom:6px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}dt{color:var(--mu)}dd{margin:0;word-break:break-word}
.wm{color:var(--web);font-size:12px;font-weight:700}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-weight:600}
#bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 20px;background:var(--ac2);border-bottom:1px solid var(--bd)}
.sm.danger{color:#c0392b;font-weight:600}.sm.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card.sel,.lrow.sel{outline:3px solid var(--ac);outline-offset:-3px}.cv{position:relative}.ck{position:absolute;top:4px;left:8px;font-size:22px;color:#fff;text-shadow:0 0 4px #000}
.mt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.mt .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.mr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.mr .ell{flex:1}
.fld{display:grid;gap:4px;margin-bottom:10px}.fld input{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
#glist{min-height:90px}#pllist{max-height:150px;overflow:auto;padding:0 10px 8px}
.pl{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0;transition:.12s;box-shadow:0 2px 8px #0005}
.card:hover .pl,.lrow:hover .pl{opacity:1}@media(hover:none){.pl{opacity:1}}
.now .cb b,.lrow.now .ell b{color:var(--ac)}.now{box-shadow:inset 0 0 0 2px var(--ac)}
#player{position:fixed;left:270px;right:0;bottom:0;z-index:8;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -4px 16px #0002}
.pcv{width:48px;height:48px;border-radius:8px;background:var(--bd) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mu);flex:none}
.pin{display:flex;flex-direction:column;min-width:0;width:200px;flex:none}.pc{display:flex;gap:4px;align-items:center}
#player button{background:none;border:0;font-size:18px;cursor:pointer;padding:6px 8px;border-radius:8px}#player button:hover{background:var(--bg)}
#player .main{background:var(--ac);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px}#player .main:hover{background:var(--ac)}
#player button.on{color:var(--ac);background:var(--ac2)}
.pseek{flex:1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu);min-width:0}.pseek input{flex:1;accent-color:var(--ac);min-width:60px}
body.hasp #content{padding-bottom:110px}body.hasp aside{padding-bottom:70px}
@media(max-width:760px){#player{left:0;flex-wrap:wrap;gap:8px}.pin{width:calc(100% - 70px)}.pseek{order:5;flex-basis:100%}}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:180px}.lrow{grid-template-columns:44px 1fr 1fr}.lrow .h{display:none}}

/* ===== Dj Ape1 theme ===== */
:root{--bg:#0b0a14;--card:#15132a;--tx:#f1eefc;--mu:#8f8aae;--bd:#2a2650;--ac:#ff2e93;--ac2:#2a1030;--web:#22d3ee;--web2:#0e2f3a;--n2:#22d3ee}
body{font-family:"Space Grotesk",system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -10%,#4a0d5c66,transparent),radial-gradient(800px 500px at -10% 110%,#0a3d6366,transparent),var(--bg);background-attachment:fixed}
h1,h2,h3,.brand,.kp b{font-family:Righteous,"Space Grotesk",sans-serif;font-weight:400}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bar{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes eqm{0%{background-size:4px 25%,4px 85%,4px 55%}50%{background-size:4px 90%,4px 35%,4px 80%}100%{background-size:4px 40%,4px 95%,4px 30%}}
.box{background:none;border:0;max-width:680px}.box h1{font-size:84px;margin:6px 0 10px;line-height:1;background:linear-gradient(90deg,var(--ac),var(--n2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff2e9366)}
.disc{width:210px;height:210px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,var(--ac) 0 17%,#0b0a14 18% 21%,transparent 22%),repeating-radial-gradient(circle,#1d1a3a 0 2px,#0c0b1f 3px 5px);box-shadow:0 0 70px #ff2e9355,inset 0 0 0 6px #0b0a14;animation:spin 7s linear infinite}
.eqb{display:flex;gap:4px;align-items:flex-end;height:64px;margin:6px auto 26px;max-width:520px}.eqb i{flex:1;height:var(--h);transform-origin:bottom;background:linear-gradient(var(--ac),var(--n2));border-radius:3px;animation:bar 1.1s ease-in-out infinite alternate}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center;margin:14px 0}
.big{background:linear-gradient(90deg,var(--ac),#8b5cf6);box-shadow:0 6px 26px #ff2e9355}.big.alt{background:linear-gradient(90deg,#22d3ee,#6366f1);box-shadow:0 6px 26px #22d3ee44}
.sm{border-radius:10px;transition:.12s}.sm:hover{border-color:var(--ac)}
.top{box-shadow:0 1px 0 #ff2e9333}.top input[type=search]:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #ff2e9333}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 2px;font-size:28px}.brand span:last-child{background:linear-gradient(90deg,var(--ac),var(--n2));-webkit-background-clip:text;background-clip:text;color:transparent}
.vin{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--ac) 0 18%,#0b0a14 20% 25%,transparent 27%),repeating-radial-gradient(circle,#1d1a3a 0 2px,#0c0b1f 3px 4px);animation:spin 4s linear infinite;animation-play-state:paused}
body.playing .vin{animation-play-state:running}
.vinyl{background:radial-gradient(circle,var(--ac) 0 10%,#0b0a14 11% 13%,transparent 14%),repeating-radial-gradient(circle,#1d1a3a 0 2px,#0c0b1f 3px 5px)!important;font-size:0!important}
.card{border-radius:10px}.card:hover{box-shadow:0 0 0 1px var(--ac),0 12px 34px #ff2e9344}
.now .cv::after{content:"";position:absolute;left:8px;bottom:8px;width:20px;height:18px;background:linear-gradient(var(--n2),var(--n2)) 0 100%/4px 40% no-repeat,linear-gradient(var(--n2),var(--n2)) 8px 100%/4px 80% no-repeat,linear-gradient(var(--n2),var(--n2)) 16px 100%/4px 55% no-repeat;animation:eqm .9s ease-in-out infinite}
.mc{border:1px solid var(--bd);box-shadow:0 0 60px #ff2e9322}.mc.wide{max-width:1000px}
#player{border-top:1px solid var(--ac);box-shadow:0 -6px 30px #ff2e9333}
.pcv{border-radius:50%;position:relative;border:2px solid #0b0a14;box-shadow:0 0 0 2px var(--bd)}.pcv::after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--bg)}
body.playing .pcv{animation:spin 6s linear infinite}
#dz{position:fixed;inset:0;z-index:30;background:#0b0a14dd;display:flex;align-items:center;justify-content:center;font:42px Righteous,sans-serif;color:var(--ac);border:4px dashed var(--ac);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:5px 11px;border-radius:99px;cursor:pointer;font:inherit}.chip small{color:var(--mu)}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}.chip.on small{color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.kp{background:linear-gradient(135deg,var(--ac2),var(--bg));border:1px solid var(--bd);border-radius:14px;padding:14px}.kp b{display:block;font-size:32px;color:var(--ac)}.kp span{color:var(--mu);font-size:13px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.sg section{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px}.sg h3{margin:0 0 10px;font-size:17px}
.hr{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.ht{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.ht i{display:block;height:100%;border-radius:6px}.hr b{text-align:right}
.cols{display:flex;gap:5px;align-items:flex-end;height:200px}.cc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px}.cc i{width:100%;border-radius:5px 5px 0 0;min-height:2px}.cc span{margin-top:4px;color:var(--mu);white-space:nowrap}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.lg{font-size:13px;margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#printarea{display:none}
@media print{
 :root{--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#ccc;--ac:#c2185b;--ac2:#fce4ec}
 body{background:#fff!important;color:#111!important;font:12px/1.4 system-ui,sans-serif}
 body>*:not(#printarea){display:none!important}#printarea{display:block!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ph{border-bottom:3px solid #c2185b;margin-bottom:14px;padding-bottom:6px}.ph h1{margin:0;font-size:26px}
 table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:3px 6px;border-bottom:1px solid #ddd}th{border-bottom:2px solid #111}tr{break-inside:avoid}
 h2{break-after:avoid;margin:18px 0 4px;font-size:16px}.sg section,.kp{break-inside:avoid;background:#fff}
}

/* ===== table, keys, dropdowns ===== */
.tbl{min-width:var(--tw,900px)}
.thead,.trow{display:grid;grid-template-columns:var(--gtc);align-items:center}
.thead{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--ac);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.th{position:relative;padding:11px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}.th:hover{color:var(--tx)}.th.on{color:var(--ac)}
.rz{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:col-resize;touch-action:none}.rz::after{content:"";position:absolute;right:4px;top:25%;bottom:25%;width:2px;background:var(--bd)}.rz:hover::after{background:var(--ac)}
.trow{border-bottom:1px solid var(--bd);min-height:54px}.trow:hover{background:#ffffff0d}.trow.sel{background:var(--ac2)}.trow.focus,.card.focus{background:#ff2e9320}
.trow.now{box-shadow:inset 3px 0 var(--ac)}.trow.now .tc b{color:var(--ac)}
.tc{padding:6px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tc .tags{flex-wrap:nowrap;margin:0;overflow:hidden}
.trow .cv{width:40px;height:40px;aspect-ratio:auto;border-radius:6px;margin:6px 6px 6px 8px}.trow .cv .pl{display:none}
.ta{display:flex;gap:4px;justify-content:flex-end;padding-right:8px}
.ib{cursor:pointer;color:var(--mu);width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px}.ib:hover{background:var(--ac);color:#fff}
.card{position:relative}.ibc{position:absolute;top:6px;right:6px;background:#000b;color:#fff;opacity:0}.card:hover .ibc{opacity:1}@media(hover:none){.ibc{opacity:1}}
.kb{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px;color:#fff}.kb small{font-weight:400;opacity:.85}
.dd{border:1px solid var(--bd);border-radius:8px;background:var(--bg)}.dd summary{padding:9px 12px;cursor:pointer}
.ddl{max-height:210px;overflow:auto;padding:8px 12px;border-top:1px solid var(--bd);display:grid;gap:5px}.ddl label{display:flex;gap:8px;align-items:center;cursor:pointer}.ddl small{color:var(--mu);margin-left:auto}
.pdel{opacity:0;margin-left:6px;color:var(--mu)}.gi:hover .pdel{opacity:1}.pdel:hover{color:#ff5470}

/* ===== v8: palette (DJ deck look) ===== */
:root{--bg:#1a1a1a;--card:#262626;--tx:#ececec;--mu:#9d9d9d;--bd:#3a3a3a;--ac:#f2a33a;--ac2:#3b2a12;--web:#1fb5e6;--web2:#10303b;--n2:#1fb5e6;--key:#62e0a0;--gold:#f5b335;--btn:linear-gradient(#cf7a22,#a85a12);--row:#222;--rowh:#292929;--sel:#444;--onac:#1a1a1a;color-scheme:dark}
:root[data-theme=light]{--bg:#ecebe6;--card:#fff;--tx:#1d1d1b;--mu:#6c6b66;--bd:#d6d4cc;--ac:#e08a12;--ac2:#fbe9cc;--web:#0a7fa8;--web2:#d8eef6;--n2:#0a7fa8;--key:#15905a;--gold:#b8780a;--btn:linear-gradient(#e89a2c,#c9770f);--row:#f7f6f1;--rowh:#efede5;--sel:#dcdad2;--onac:#1a1a1a;color-scheme:light}
body{background:var(--bg);background-attachment:scroll}*{scrollbar-color:var(--bd) transparent}
.box h1,.brand span:last-child{background:linear-gradient(90deg,var(--ac),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
.disc,.vin,.vinyl{background:radial-gradient(circle,var(--ac) 0 17%,#111 18% 21%,transparent 22%),repeating-radial-gradient(circle,#2c2c2c 0 2px,#141414 3px 5px)!important}
.vinyl{background:radial-gradient(circle,var(--ac) 0 10%,#111 11% 13%,transparent 14%),repeating-radial-gradient(circle,#2c2c2c 0 2px,#141414 3px 5px)!important}
.disc{box-shadow:0 0 50px #f2a33a40,inset 0 0 0 6px #111}
.eqb i{background:linear-gradient(#ff4a3d,var(--ac) 45%,var(--key))}
.big,#player .main{background:var(--btn);color:#fff;box-shadow:none}.big.alt{background:var(--card);border:1px solid var(--ac);color:var(--tx)}
.sm.on,.mt .on,.seg .on{background:var(--btn);color:#fff;border-color:var(--ac)}.sm:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}.chip.on small{color:var(--onac)}
.top{background:var(--card);box-shadow:none}.top input[type=search]:focus{box-shadow:none}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}.tools .sm,.btns .langsel,.btns .themebtn{padding:8px 10px;cursor:pointer}
.gi.on{background:var(--ac2);color:var(--ac)}
.card:hover{box-shadow:0 0 0 1px var(--ac)}.card.now{box-shadow:0 0 0 2px var(--ac)}
.mc{box-shadow:0 12px 60px #0008}
.thead{background:var(--card);border-bottom:2px solid var(--ac)}
.trow{background:var(--row)}.trow:nth-child(even){background:var(--rowh)}.trow:hover{background:var(--sel)}
.trow.focus{background:var(--sel)}.trow.now{background:var(--ac);box-shadow:none;color:var(--onac)}
.trow.now .tc,.trow.now .tc b,.trow.now .kb,.trow.now .ib{color:var(--onac)}.card.focus{background:var(--sel)}
.kb{background:none!important;color:var(--key);padding:0;font-size:14px;font-weight:600}.kb small{display:none}
#partist{color:var(--gold)}
#player{background:var(--card);border-top:2px solid var(--ac);box-shadow:none}#player button.on{color:var(--ac);background:var(--ac2)}

function mact(a,k){
 if(a==="lib_wipe"){libWipe().then(()=>{toast("Η αποθηκευμένη βιβλιοθήκη του browser διαγράφηκε");manage()});return}
 if(a==="pd"){delPL(k);manage();return}
 if(a==="pr"){const p=PL.find(x=>x.id===k),n=p&&prompt("Νέο όνομα:",p.name);if(n&&n.trim()){p.name=n.trim();markDirty();drawPL();manage()}return}
 if(a==="rf"){const arr=rootsOf()[k]||[];if(confirm(`Να αφαιρεθούν ${arr.length} τραγούδια του «${k}» από τη βιβλιοθήκη;`)){removeTracks(arr);manage()}}
 if(a==="gr"){const v=prompt(`Νέο όνομα για το είδος «${k}» (αν υπάρχει ήδη, θα γίνει συγχώνευση):`,k);if(!v||!v.trim())return;
  const all=new Set();T.forEach(t=>t.genres.forEach(g=>all.add(g)));const nn=v.trim(),name=[...all].find(g=>g.toLowerCase()===nn.toLowerCase())||nn;
  T.forEach(t=>{if(t.genres.includes(k)){const o=[];t.genres.map(g=>g===k?name:g).forEach(g=>{if(!o.some(x=>x.toLowerCase()===g.toLowerCase()))o.push(g)});t.genres=o;t.gsrc="manual"}});
  if(selG===k)selG=name;markDirty();render();manage();toast("Το είδος ενημερώθηκε")}
 if(a==="gd"){if(confirm(`Να αφαιρεθεί το είδος «${k}» από όλα τα τραγούδια;`)){T.forEach(t=>{if(t.genres.includes(k)){t.genres=t.genres.filter(g=>g!==k);t.gsrc=t.genres.length?"manual":"none"}});if(selG===k)selG=null;markDirty();render();manage()}}
 if(a==="dd"){const rest=[];dupGroups().forEach(g=>{const keep=g.reduce((x,y)=>(!!y.file!==!!x.file?!!y.file:(y.bytes||0)>(x.bytes||0))?y:x);g.forEach(t=>{if(t!==keep)rest.push(t)})});if(confirm(`Να αφαιρεθούν ${rest.length} περιττά αντίγραφα;`)){removeTracks(rest);manage()}}
 if(a==="shownog"){selG=NOG;$("modal").classList.add("hide");render()}
 if(a==="webmiss"){if(webBusy){toast("Η αναζήτηση τρέχει ήδη");return}Object.keys(cache).forEach(x=>{if(!cache[x]||cache[x].none||!Object.keys(cache[x]).length)delete cache[x]});try{localStorage.setItem("mlcache",JSON.stringify(cache))}catch(e){}$("modal").classList.add("hide");webFill()}
 if(a.startsWith("sg_")){const A=T.filter(t=>t.sug),ok=t=>applySug(t,t.sug),no=t=>{delete t.sug;t.webRej=1};
  if(a==="sg_ok"||a==="sg_no"){const t=T.find(x=>x.id===k);if(t)(a==="sg_ok"?ok:no)(t)}else if(a==="sg_all")A.forEach(ok);else if(a==="sg_hi")A.filter(t=>t.sug.conf>=80).forEach(ok);else if(a==="sg_rej")A.forEach(no);
  markDirty();render();manage();return}
 if(a==="bk_open"){window.desktop.native.openLibDir();return}if(a==="bk_list"){bkModal();return}
 if(a==="relinkall"){if(!DIRS.length){toast("Πρόσθεσε πρώτα φάκελο μουσικής (＋ → Φάκελοι)");return}syncDirs(DIRS,true).then(()=>manage());return}
 if(a==="webundo"){if(!confirm("Να αφαιρεθούν όλα τα δεδομένα που προήλθαν από το web (είδη, καλλιτέχνης, άλμπουμ, έτος); Όσα όρισες εσύ ή υπήρχαν στα tags δεν αλλάζουν."))return;let c=0;T.forEach(t=>{if(t.gsrc&&t.gsrc.startsWith("web")){t.genres=[];t.gsrc="none";c++}(t.webFilled||[]).forEach(k=>{if(k==="album"){const p=String(t.path).split("/");t.album=p.length>1?p[p.length-2]:"";t.miss=[...new Set([...(t.miss||[]),"album"])]}else t[k]="";c++});t.webFilled=[]});cache={};saveCache(true);markDirty();render();manage();toast(`Αναιρέθηκαν ${c} αλλαγές από το web`);return}
 if(a==="cc"){cache={};try{localStorage.removeItem("mlcache")}catch(e){}manage();toast("Καθαρίστηκε")}
}

function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function startQ(list,t,fade){fadeSec=fade||0;if(!fadeSec)au.volume=1;QL=list.filter(x=>x.file);

 if(!t||!t.file)t=shuf?QL[Math.random()*QL.length|0]:QL[0];buildQ(t);cue(qi)}
function cue(i){qi=i;cur=Q[i];if(curUrl){const o=curUrl;setTimeout(()=>URL.revokeObjectURL(o),30000)}curUrl=cur.file.native?cur.file.url:URL.createObjectURL(cur.file);au.src=curUrl;au.play().catch(()=>{});

 $("pcv").style.backgroundImage=cur.cover?`url(${cur.cover})`:"";$("pcv").textContent=cur.cover?"":"♪";document.title="▶ "+(cur.title||"")+" — Dj Ape1";
 try{navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist,album:cur.album,artwork:cur.cover?[{src:cur.cover}]:[]})}catch(e){}
 markNow()}

 m.onclick=e=>{if(e.target===m||e.target.className==="x")m.classList.add("hide")};m.querySelectorAll("[data-q]").forEach(r=>r.onclick=()=>cue(+r.dataset.q))};
